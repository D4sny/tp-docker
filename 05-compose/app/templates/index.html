<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livre d'or</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f2f5f7; color: #222; margin: 0; }
    main { max-width: 640px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { color: #0b7fab; }
    form, .msg { background: #fff; border-radius: 8px; padding: 1rem; margin-bottom: 1rem;
                 box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    input, textarea { width: 100%; box-sizing: border-box; padding: .5rem; margin-bottom: .5rem;
                      font: inherit; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #0b7fab; color: #fff; border: 0; padding: .6rem 1.2rem;
             border-radius: 4px; font: inherit; cursor: pointer; }
    .meta { color: #777; font-size: .85rem; }
    footer { color: #999; font-size: .8rem; text-align: center; margin-top: 2rem; }
  </style>
</head>
<body>
  <main>
    <h1>📖 Livre d'or</h1>

    <form method="post">
      <input name="author" placeholder="Ton nom" maxlength="50">
      <textarea name="content" placeholder="Ton message" maxlength="500" rows="3" required></textarea>
      <button type="submit">Signer</button>
    </form>

    {% for author, content, created_at in messages %}
      <div class="msg">
        <div class="meta"><strong>{{ author }}</strong> — {{ created_at.strftime("%d/%m/%Y %H:%M") }}</div>
        <p>{{ content }}</p>
      </div>
    {% else %}
      <p>Aucun message pour l'instant.</p>
    {% endfor %}

    <footer>Servi par le conteneur <code>{{ hostname }}</code></footer>
  </main>
</body>
</html>
