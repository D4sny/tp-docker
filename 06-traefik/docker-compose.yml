# Bonus : un reverse proxy (Traefik) devant plusieurs sites.
# UN seul port publié (80) ; Traefik aiguille chaque requête vers le bon conteneur
# en fonction du nom de domaine demandé.

services:

  # --- Le reverse proxy ---
  traefik:
    image: traefik:v3.6            # >= v3.6.1 requis avec Docker Engine 29+
    command:
      - --providers.docker=true                    # Traefik lit la config dans les labels des conteneurs
      - --providers.docker.exposedbydefault=false  # ... seulement ceux qui ont traefik.enable=true
      - --entrypoints.web.address=:80              # écoute en HTTP sur le port 80
      - --api.dashboard=true
      - --api.insecure=true                        # dashboard sur :8080, sans auth (OK pour un TP, JAMAIS en prod)
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${DASHBOARD_PORT:-8088}:8080"
    volumes:
      # Traefik a besoin de "voir" les conteneurs : il lit le socket Docker.
      # Donner le socket = donner le contrôle de Docker. On le monte en lecture seule.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # --- Votre site de l'étape 3 ---
  site:
    build: ../03-dockerfile
    # Pas de "ports:" ! C'est Traefik qui l'expose.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.site.rule=Host(`site.${DOMAIN}`)"
      - "traefik.http.routers.site.entrypoints=web"
      - "traefik.http.services.site.loadbalancer.server.port=80"
    restart: unless-stopped

  # --- Un mini serveur qui affiche qui a répondu (utile pour voir la répartition de charge) ---
  whoami:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.${DOMAIN}`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
    restart: unless-stopped
