# Compteur de visites : une app Flask et un cache Redis.

services:

  app:
    build: ./app
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWD}
    networks:
      - front
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - cache-data:/var/lib/redis
    networks:
      - back
    restart: unless-stopped

volumes:
  cache-data:

networks:
  front:
  back:
